[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "box"
version = "0.4.0"
description = "Native GTK4/libadwaita GUI for Google LiteRT-LM on Ubuntu"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Jegly" }]
dependencies = [
    "litert-lm-api>=0.12.0",
    "PyGObject>=3.50; sys_platform != 'win32'",
    "sounddevice>=0.5.6",
    # Voice-activity detection for live conversation mode (RMS fallback if absent)
    "webrtcvad-wheels>=2.0",
    "numpy>=2.5.4",
    "pypdf>=6.20.0",
    # RAG: embedding model runtime + tokenizer
    "ai-edge-litert>=2.3.0",
    "sentencepiece>=0.2.2",
    # Phase 4 tools: free, key-less web search via DuckDuckGo
    "ddgs>=9.16.0",
    # Display-math (LaTeX $$…$$) rendering via matplotlib mathtext — no TeX
    # install needed. Inline math uses the dependency-free Unicode renderer.
    "matplotlib>=3.11.2",
    # TurboVec: Rust-backed SIMD vector index (Google TurboQuant). Replaces the
    # numpy float32 BLOB search for RAG, notebooks, and persistent memory.
    "turbovec>=1.1.2",
]

[project.scripts]
box = "box_chat.__main__:main"

[tool.setuptools]
packages = ["box_chat"]
