# Builds the .deb (scripts/build_deb.sh: box_chat, vendored pip deps, bundled
# engines) on every push to main and every PR, including Dependabot's. The
# script's own schema gate runs on the packaged box_chat.
# Nothing is published from here; see release.yml.
#
# Built inside the latest Ubuntu (ubuntu:latest): the .deb pins the build
# system's Python (e.g. >= 3.14, << 3.15), so it targets the newest release.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build .deb
    runs-on: ubuntu-latest
    container: ubuntu:latest
    defaults:
      run:
        # Container jobs default to sh; the steps use bash.
        shell: bash
    timeout-minutes: 90
    steps:
      # Build tools, plus the runtime the package depends on (packaging/control.in)
      # so the schema gate imports the compiled module as an installed Box would.
      - name: Install build tools and runtime dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates curl unzip git build-essential dpkg-dev \
            python3 python3-dev python3-venv \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gstreamer-1.0 \
            gstreamer1.0-plugins-good libportaudio2 libgomp1 zlib1g libzstd1

      - uses: actions/checkout@v7

      # The engines are pinned and SHA-256-checked by the fetch scripts;
      # caching only saves the download.
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/fetch_*.sh') }}

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-ubuntu-latest-${{ github.sha }}
          restore-keys: pip-ubuntu-latest-

      - name: Fetch inference engines
        run: |
          bash scripts/fetch_llama_server.sh
          bash scripts/fetch_sd_cpp.sh

      # build_deb.sh drives pip through the project's .venv (same Python as
      # the system python3 it compiles with).
      - name: Create .venv
        run: python3 -m venv .venv

      - name: Build .deb
        run: bash scripts/build_deb.sh

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: |
            build/box_*_amd64.deb
            build/requirements-frozen.txt
          if-no-files-found: error
          retention-days: 14
